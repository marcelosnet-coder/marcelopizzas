<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mary's Pizzaria 🍕</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>Mary's Pizzaria 🍕</header>
  <main class="container">
    <h2>Monte sua pizza</h2>
    <div id="menu" class="menu"></div>
    <div class="carrinho">
      <h3>Carrinho</h3>
      <ul id="carrinho-lista"></ul>
      <p id="total"></p>
      <button id="btn-whatsapp">Enviar Pedido no WhatsApp</button>
    </div>
  </main>

  <!-- Modal para segundo sabor -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <h3>Escolha o segundo sabor 🍕</h3>
      <ul id="lista-sabores"></ul>
      <button id="confirmar-sabor">Confirmar</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
