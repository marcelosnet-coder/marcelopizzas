
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mary's Pizza</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="home" class="page active fade">
  <img src="logo.png" class="logo">
  <h1>MARY'S PIZZA</h1>
  <p>📞 (81) 9 9185-1200</p>
  <p>📍 Rua Dr. Sebastião Amaral, 1203 – Pau Amarelo</p>
  <img src="pizza.jpg" class="hero">
  <button onclick="goPage('menu')">Faça seu pedido online</button>
</section>

<section id="menu" class="page fade">
  <h2>Pizzas</h2>
  <div class="grid" id="pizzaList"></div>
  <h2>Bebidas</h2>
  <div class="grid" id="drinkList"></div>
  <button onclick="goPage('order')">Avançar</button>
</section>

<section id="order" class="page fade">
  <h2>Monte sua Pizza 🍕</h2>
  <select id="qtd" onchange="updateChoice()">
    <option value="1">1 sabor</option>
    <option value="2">2 sabores</option>
  </select>

  <div id="board"></div>

  <input placeholder="Nome" id="nome">
  <input placeholder="Endereço" id="endereco">
  <input placeholder="Telefone" id="fone">

  <button onclick="sendWhats()">Finalizar Pedido</button>
</section>

<script src="script.js"></script>
</body>
</html>
